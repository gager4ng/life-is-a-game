name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke-run the simulation
        run: node apps/sim/dist/cli.js --seed 42 --days 3 > /dev/null
      - name: Browser smoke test (Chromium, 1 worker)
        run: |
          pnpm --filter @liag/web exec playwright install --with-deps chromium
          pnpm e2e
